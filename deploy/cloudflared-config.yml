# Cloudflare Tunnel ingress rules.
#
# This is one shared tunnel for the whole Pi (named "chlodny-pi"), not one
# tunnel per app — Cloudflare Tunnels support routing multiple hostnames
# through a single tunnel via ingress rules, and both chlodny apps live on
# the same box; Nginx does the per-app routing from there via server_name.
# Generated as a starting point after `cloudflared tunnel create chlodny-pi`
# — replace <TUNNEL_UUID> below with the UUID printed by that command, then
# install as /etc/cloudflared/config.yml (see DEPLOYMENT.md).
#
# If a third app joins this Pi later, add another `- hostname:` entry below
# rather than creating a new tunnel.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: chlodny-blog.pl
    service: http://localhost:80
  - hostname: chlodny-kacik.pl
    service: http://localhost:80
  - service: http_status:404
