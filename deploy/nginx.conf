# Nginx vhost for chlodny-blog.pl on the Raspberry Pi.
#
# Only listens on loopback: the sole entry point is the Cloudflare Tunnel
# daemon (cloudflared) running on the same host, forwarding to localhost:80.
# No port is opened on the router.
#
# Install at /etc/nginx/sites-available/chlodny-blog, then:
#   sudo ln -s /etc/nginx/sites-available/chlodny-blog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name chlodny-blog.pl;
    root /var/www/chlodny-blog/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM socket version must match whatever `php -v` reports after setup.
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # cloudflared only ever forwards requests that arrived over https at
        # the Cloudflare edge, so this is always true for anything nginx sees.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
